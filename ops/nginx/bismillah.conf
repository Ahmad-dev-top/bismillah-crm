# /etc/nginx/sites-available/bismillah
# Internet -> nginx :443 -> node :3000 (API) and apps/web/dist (UI)
# DuckDNS points the hostname at this VM. There is no Cloudflare proxy, so
# $remote_addr is already the client. Do not use CF-Connecting-IP here.

limit_req_zone $binary_remote_addr zone=bi_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=bi_login:10m rate=1r/s;

upstream bi_api { server 127.0.0.1:3000; keepalive 32; }

# Replace YOURSUB.duckdns.org in both server_name lines and the cert paths.
server {
    listen 80;
    listen [::]:80;
    server_name YOURSUB.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOURSUB.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/YOURSUB.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOURSUB.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 25M;

    location /api/auth/login {
        limit_req zone=bi_login burst=5 nodelay;
        proxy_pass http://bi_api;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=bi_api burst=60 nodelay;
        proxy_pass http://bi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }

    location / {
        root /opt/bismillah/current/apps/web/dist;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    location ~* \.(js|css|woff2|svg|png)$ {
        root /opt/bismillah/current/apps/web/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
