# Temporary HTTP-only site so certbot can issue the first certificate.
# Replace YOURSUB.duckdns.org then remove this after TLS is enabled.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name YOURSUB.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }
}
